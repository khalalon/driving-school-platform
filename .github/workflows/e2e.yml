name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * *' # tous les jours à 4 h UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer la stack (Postgres, Redis, 8 services, Nginx)
        run: docker compose up -d --build

      - name: Attendre la passerelle
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/health >/dev/null; then
              echo "Passerelle prête après ${i} essai(s)"
              exit 0
            fi
            sleep 3
          done
          echo "Passerelle injoignable" >&2
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Installer le harnais
        run: npm ci
        working-directory: tests

      # Le harnais (tests/setup.ts) applique tests/fixtures/seed.sql avant la campagne.
      # TODO(5.8): retirer continue-on-error — le chemin critique devient bloquant quand le
      # contrat est entièrement EXISTE.
      - name: Tests de bout en bout (informatif)
        id: e2e
        continue-on-error: true
        run: npm run test:e2e -- --ci --json --outputFile=report.json
        env:
          GATEWAY_URL: http://localhost

      - name: Résumé
        if: always()
        run: |
          if [ -f tests/report.json ]; then
            node -e '
              const r = require("./tests/report.json");
              const lines = [
                "## Tests de bout en bout",
                "",
                `**${r.numPassedTests} réussi(s), ${r.numFailedTests} en échec** sur ${r.numTotalTests} (informatif jusqu à 5.8)`,
                "",
              ];
              for (const s of r.testResults) {
                for (const t of s.assertionResults) {
                  lines.push(`- ${t.status === "passed" ? "✅" : "❌"} ${t.fullName}`);
                }
              }
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            '
          else
            echo "## Tests de bout en bout" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucun rapport produit (le harnais n a pas démarré)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: tests/report.json
          if-no-files-found: warn

      - name: Journaux de la stack en cas d'échec
        if: steps.e2e.outcome == 'failure'
        run: docker compose logs --tail=100

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
