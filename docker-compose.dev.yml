# Surcharge de développement : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# L'API tourne depuis les sources (ts-node-dev) avec rechargement à chaud.
services:
  postgres:
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: driving_school

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: ./services/api
      target: builder
    volumes:
      - ./services/api/src:/app/src
    command: npm run dev
    environment:
      NODE_ENV: development
