user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Limitation par adresse IP (l'application n'a qu'un garde-fou global).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Résolution du nom `api` à la requête (DNS interne Docker) : un conteneur reconstruit
    # change d'adresse sans que Nginx ait à redémarrer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        set $api_upstream http://api:3000;

        # CORS : le mobile passe par ici depuis un autre hôte.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age "3600" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Un seul upstream : l'application unique (services/api).
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"Route inconnue"}';
        }
    }
}
